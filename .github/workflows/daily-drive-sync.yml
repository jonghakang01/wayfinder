# The daily schedule moved to prod's own crontab (deploy/drive-sync.sh,
# 2026-08-07): GitHub's cron fired 1-2.5h late every day and on 8/6 never
# assigned a runner, silently skipping the day. This stays as a manual button
# only — useful when the server's cron itself is in question.
name: Daily Drive Sync

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger batch OCR via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            bash /root/drive-sync.sh
